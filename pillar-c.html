<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product C</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #ECE7DD; color: #131A22; margin: 0; padding: 56px 72px; }
  .page-header .back-link { display: inline-block; font-size: 14px; color: #4a4a4a; text-decoration: none; margin-bottom: 20px; }
  .page-header .back-link:hover { color: #131A22; text-decoration: underline; }
  .page-header h1 { font-size: 42px; font-weight: 800; margin: 0 0 14px; letter-spacing: -0.5px; }
  .page-header p { font-size: 17px; color: #4a4a4a; max-width: 720px; margin: 0; line-height: 1.5; }
  .pillar-row { margin-top: 56px; }
  .sidebar .pillar-label { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; color: #8a8a8a; text-transform: uppercase; margin-bottom: 14px; }
  .sidebar .pillar-name { font-size: 28px; font-weight: 800; line-height: 1.2; margin: 0 0 24px; }
  .sidebar .vibes { font-size: 15px; font-style: italic; color: #6a6a6a; line-height: 1.75; margin: 0 0 28px; }
  .sidebar .signal-tag { display: inline-block; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #F5E6D3; color: #8B5A2B; }
  .pdp { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .amazon-header { background: #131A22; padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
  .amazon-logo { color: #FF9900; font-weight: 800; font-size: 26px; font-family: Georgia, serif; letter-spacing: -1px; }
  .amazon-logo sup { font-size: 12px; color: white; font-family: -apple-system, sans-serif; font-weight: 400; }
  .search-bar { flex: 1; display: flex; background: white; border-radius: 4px; overflow: hidden; height: 38px; }
  .search-input { flex: 1; border: none; outline: none; padding: 0 14px; font-size: 14px; }
  .search-btn { width: 48px; background: #FEBD69; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #131A22; }
  .cart { color: white; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .cart-icon { font-size: 20px; }
  .breadcrumb { padding: 14px 24px; font-size: 14px; color: #007185; border-bottom: 1px solid #eee; }
  .product-body { display: grid; grid-template-columns: 300px 1fr; gap: 36px; padding: 28px; }
  .product-image { background: #fafafa; border-radius: 6px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 110px; }
  .thumbnails { display: flex; gap: 8px; margin-top: 12px; }
  .thumb { width: 52px; height: 52px; background: #fafafa; border: 1px solid #ddd; border-radius: 4px; }
  .thumb.active { border-color: #E47911; border-width: 2px; }
  .product-info h2 { font-size: 28px; font-weight: 700; margin: 0 0 14px; line-height: 1.2; }
  .rating-line { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #007185; margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
  .stars { color: #DE7921; font-size: 16px; letter-spacing: -1px; }
  .dot-sep { color: #999; }
  .price { font-size: 32px; font-weight: 400; margin: 0 0 14px; color: #0F1111; }
  .prime-line { font-size: 14px; color: #0F1111; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
  .prime-badge { background: #007185; color: white; font-style: italic; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 3px; }
  .delivery-text { color: #007185; font-weight: 600; }
  .add-to-cart { display: block; width: 100%; background: #FFD814; color: #0F1111; border: 1px solid #FCD200; padding: 14px; border-radius: 999px; font-size: 16px; font-weight: 500; cursor: pointer; margin-bottom: 22px; }
  .subtitle-below-cta { font-size: 16px; color: #333; line-height: 1.6; margin: 0; }
  @media (max-width: 640px) {
    body { padding: 24px 16px; }
    .page-header h1 { font-size: 26px; }
    .page-header .back-link { margin-bottom: 16px; }
    .pillar-row { margin-top: 24px; }
    .pdp { border-radius: 8px; }
    .amazon-header { padding: 10px 14px; gap: 10px; }
    .amazon-logo { font-size: 20px; }
    .amazon-logo sup { font-size: 10px; }
    .search-bar { height: 32px; }
    .cart { font-size: 12px; }
    .cart-icon { font-size: 16px; }
    .breadcrumb { padding: 10px 16px; font-size: 12px; }
    .product-body { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
    .product-image { max-width: 280px; margin: 0 auto; font-size: 90px; }
    .product-info h2 { font-size: 22px; }
    .price { font-size: 26px; }
    .add-to-cart { padding: 12px; font-size: 15px; }
    .subtitle-below-cta { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="page-header">
    <a class="back-link" href="index.html">← Back to other product listings</a>
    <h1>Maternal Health Product C</h1>
  </div>
  <div class="pillar-row">
    <div class="pdp">
      <div class="amazon-header">
        <div class="amazon-logo">amazon<sup>.com</sup></div>
        <div class="search-bar">
          <input class="search-input" type="text" value="" placeholder="">
          <div class="search-btn">🔍</div>
        </div>
        <div class="cart"><span class="cart-icon">🛒</span> Cart</div>
      </div>
      <div class="breadcrumb">Health &amp; Household › Maternity &amp; Nursing › Breast Care</div>
      <div class="product-body">
        <div>
          <div class="product-image">🍼</div>
          <div class="thumbnails">
            <div class="thumb active"></div>
            <div class="thumb"></div>
            <div class="thumb"></div>
          </div>
        </div>
        <div class="product-info">
          <h2>Time-Saving</h2>
          <div class="rating-line">
            <span class="stars">★★★★☆</span>
            <span>4.7</span>
            <span class="dot-sep">·</span>
            <span>500 ratings</span>
            <span class="dot-sep">·</span>
          </div>
          <div class="price">$$</div>
          <div class="prime-line">
            <span class="prime-badge">prime</span>
            <span><span class="delivery-text">FREE delivery</span> Fri, May 30</span>
          </div>
          <button class="add-to-cart" onclick="window.location.href='thank-you.html?from=C'">Add to Cart</button>
          <p class="subtitle-below-cta">work smarter not harder · get more out of every session, even on demanding days</p>
        </div>
      </div>
    </div>
  </div>
<script src="tracking.js"></script>
</body>
</html>
