<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank you</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ECE7DD;
    color: #131A22;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 48px 56px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .checkmark {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #F5E6D3;
    color: #8B5A2B;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 32px;
    font-weight: 700;
  }
  h1 { font-size: 28px; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.5px; }
  p.intro { font-size: 16px; color: #4a4a4a; line-height: 1.6; margin: 0 0 28px; }
  .question {
    text-align: left;
    margin-top: 8px;
  }
  .question label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #131A22;
  }
  .question .hint {
    font-size: 13px;
    color: #888;
    font-weight: 400;
    margin-left: 6px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    padding: 12px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: #8B5A2B; }
  .submit {
    margin-top: 16px;
    background: #131A22;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .confirmation {
    color: #2a7a3a;
    font-size: 14px;
    margin-top: 14px;
    min-height: 20px;
  }
  .back-link {
    display: inline-block;
    margin-top: 28px;
    font-size: 14px;
    color: #4a4a4a;
    text-decoration: none;
  }
  .back-link:hover { color: #131A22; text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="checkmark">✓</div>
    <h1>Thank you for participating!</h1>
    <p class="intro">Your response has been recorded. Before you go, we'd love to hear a bit more.</p>

    <div class="question">
      <label for="reason">Why did you choose this product? <span class="hint">(optional)</span></label>
      <textarea id="reason" placeholder="e.g. the wording felt trustworthy, the rating stood out..."></textarea>
      <div style="text-align: center;">
        <button id="submit-btn" class="submit">Submit response</button>
      </div>
      <div id="confirmation" class="confirmation"></div>
    </div>

    <a class="back-link" href="index.html">← Return to product listings</a>
  </div>

<script src="tracking.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const chosenPillar = params.get('from') || '';

  if (window.PillarTracking) {
    window.PillarTracking.track('thank_you_view', { chosenPillar });
  }

  const submitBtn = document.getElementById('submit-btn');
  const textarea = document.getElementById('reason');
  const confirmation = document.getElementById('confirmation');

  submitBtn.addEventListener('click', function () {
    const responseText = textarea.value.trim();
    if (window.PillarTracking) {
      window.PillarTracking.track('survey_response', {
        chosenPillar,
        responseText,
      });
    }
    submitBtn.disabled = true;
    textarea.disabled = true;
    confirmation.textContent = 'Thanks — your response was submitted.';
  });
</script>
</body>
</html>
